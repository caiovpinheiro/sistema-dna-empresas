name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Disparar deploy no EasyPanel
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.WEBHOOK_DEPLOY_SISTEMA_EMPRESAS }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Segredo WEBHOOK_DEPLOY_SISTEMA_EMPRESAS ausente. A imagem já foi publicada. Implante pelo painel."
            exit 1
          fi
          if ! curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request POST "$WEBHOOK"; then
            curl --fail --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --request GET "$WEBHOOK"
          fi
